<!doctype html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <body>
    <section class="container">
      <div class="box">
        <div class="box-image1">
          <img class="image1" src="./images/image-equilibrium.png" alt="" />
          <h1 class="creationHover">Equilibrium #3429</h1>
          <p class="p1">Our Equilibrium collection promotes balance and calm</p>
        </div>
        <div class="box-text">
          <p class="ETH">0.041ETH</p>

        </div>
        <div class="box-avatar">
          <img class="avatar" src="./images/image-avatar.png" alt="" />
          <p class="space">Creation of   </p>
          <p class="space colorText creationHover">Jules Wyvern</p>
        </div>
      </div>
    </section>
